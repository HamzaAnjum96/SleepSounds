name: CI

# Quality gate on every push and PR: typecheck, lint, unit tests, a full
# build, and the e2e + accessibility suite. The deploy workflow only publishes
# from main; this runs on every branch so broken changes are caught before they
# reach GitHub Pages.
on:
  push:
  pull_request:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.60 refuses to
    # install Chromium's system dependencies ("does not support chromium on
    # ubuntu26.04-x64"). Move this forward together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The hosted runner ships extra apt repos (packages.microsoft.com) that
      # intermittently 403 and break `apt-get update`, which fails the
      # `--with-deps` browser install below. Drop any such repo first so the
      # install depends only on the Ubuntu archives it actually needs.
      - name: Remove flaky third-party apt repos
        run: sudo grep -rl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # On failure, keep Playwright's traces and screenshots for diagnosis.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
